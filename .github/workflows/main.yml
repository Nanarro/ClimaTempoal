name: Reporte Diario Clima

on:
  schedule:
    # 12:30 UTC = 06:30 AM Hora del Centro de México
    - cron: '30 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Instalar librerías
        run: pip install -r requirements.txt
        
      - name: Ejecutar Monitor de Clima
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
        
      - name: Notificar si falla
        if: failure()
        run: |
          echo "❌ El workflow falló - revisa los logs en:"
          echo "https://github.com/${{ github.repository }}/actions"
