name: Reporte Diario Clima

on:
  schedule:
    # 12:45 UTC = 06:45 AM Hora del Centro de México
    # Ajustado para compensar el retraso típico de GitHub Actions
    - cron: '45 12 * * *'
  workflow_dispatch: # Permite ejecución manual
    inputs:
      debug:
        description: 'Modo debug (verbose)'
        required: false
        default: 'false'

jobs:
  reporte-clima:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4
        
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 🧪 Ejecutar tests
        run: |
          python -m unittest discover tests -v
        continue-on-error: true
        
      - name: 🌦️ Ejecutar Monitor de Clima
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: |
          python main.py
          
      - name: 📊 Resumen de ejecución
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Estado del workflow: ${{ job.status }}"
          echo "Tiempo de ejecución: ${{ job.duration }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
      - name: ❌ Notificar fallo
        if: failure()
        run: |
          echo "::error::El workflow falló. Revisa los logs para más detalles."
          echo "Posibles causas:"
          echo "  - Error al obtener datos meteorológicos"
          echo "  - Error al enviar mensaje a Telegram"
          echo "  - Variables de entorno mal configuradas"